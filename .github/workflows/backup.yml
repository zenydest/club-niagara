# ============================================================
# Backup de la base — Club Niágara
#
# Corre todos los días a las 12:00 UTC (09:00 en Argentina). Esa hora es a
# propósito: el boliche cierra de madrugada, así que al mediodía la base ya
# tiene todo lo de la noche anterior y nadie está operando.
#
# El dump queda como artifact del run. GitHub los guarda 90 días, que es
# bastante más que el "cero" que había hasta ahora.
#
# Requiere el secret DATABASE_URL_BACKUP en el repo:
#   Settings → Secrets and variables → Actions → New repository secret
# Tiene que ser la **External Database URL** de Render (la interna solo funciona
# dentro de su red).
# ============================================================
name: Backup DB

on:
  schedule:
    - cron: "0 12 * * *"
  # También se puede disparar a mano desde la pestaña Actions, útil antes de
  # una migración o de un cambio grande.
  workflow_dispatch:

jobs:
  backup:
    name: Dump y guardar
    runs-on: ubuntu-latest

    # El job corre dentro de la imagen oficial de Postgres, que ya trae
    # `pg_dump` de la misma versión que el servidor.
    #
    # Es más simple que instalarlo con apt: el runner de Ubuntu trae el cliente
    # 16 y no tiene el repositorio de PostgreSQL configurado, así que pedir el
    # 17 falla con "Unable to locate package". Y la versión importa: pg_dump
    # aborta contra un servidor más nuevo que él.
    #
    # Si Render actualiza la base, cambiar el tag por el que corresponda.
    container:
      image: postgres:17

    steps:
      - name: Ver versión de pg_dump
        run: pg_dump --version

      # Los mensajes describen la forma del valor, nunca el valor: los logs de
      # Actions son visibles para cualquiera con acceso al repo.
      - name: Verificar el secret
        env:
          DB_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Falta el secret DATABASE_URL_BACKUP."
            echo "Cargalo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Sin el esquema, pg_dump toma el valor como nombre de una base local
          # y falla buscando un socket en /var/run/postgresql. El error que da
          # ("is the server running locally?") manda a buscar el problema al
          # lado equivocado, así que se chequea acá.
          case "$DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "El secret no arranca con postgresql:// ni postgres://."
              echo "Tiene que ser la External Database URL completa de Render,"
              echo "con esta forma:"
              echo "  postgresql://usuario:clave@host.oregon-postgres.render.com/basename"
              echo ""
              echo "Largo del valor cargado: ${#DB_URL} caracteres."
              exit 1
              ;;
          esac

          # La URL interna de Render (sin punto en el host) solo resuelve dentro
          # de su red; desde GitHub no llega.
          case "$DB_URL" in
            *.*) ;;
            *)
              echo "El host no tiene dominio: parece la Internal Database URL."
              echo "Desde GitHub hay que usar la External."
              exit 1
              ;;
          esac

      - name: Generar el dump
        env:
          DB_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          mkdir -p backup
          NOMBRE="niagara-$(date +%Y-%m-%d).dump"

          # Formato custom (-Fc): comprimido y restaurable con pg_restore,
          # permite restaurar tablas sueltas. Un .sql plano sería más fácil de
          # leer pero pesa varias veces más.
          # `--dbname=` explícito en vez de posicional: deja claro que es una
          # connection string y no un nombre de base.
          pg_dump --dbname="$DB_URL" -Fc -f "backup/$NOMBRE"

          echo "Tamaño del dump:"
          ls -lh "backup/$NOMBRE"

          # Un dump de pocos bytes es un dump vacío: mejor fallar ruidoso que
          # guardar 90 días de archivos inservibles.
          TAMANO=$(stat -c%s "backup/$NOMBRE")
          if [ "$TAMANO" -lt 1000 ]; then
            echo "El dump pesa $TAMANO bytes. Algo salió mal."
            exit 1
          fi

      - name: Guardar el backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
