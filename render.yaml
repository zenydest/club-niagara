##
## Club Niágara — Render.com deploy config
## Docs: https://render.com/docs/render-yaml-spec
##

services:
  # ── API (Fastify + Better Auth + Socket.io) ───────────────────────
  - type: web
    name: club-niagara-api
    runtime: node
    # La base y la API tienen que estar en la MISMA región para poder usar la
    # Internal URL, que no sale a internet. Los servicios del proyecto están en
    # Virginia.
    region: virginia
    # OJO con el plan free: el servicio se apaga tras 15 min sin tráfico y el
    # siguiente request tarda 30-60s en responder. Para una demo con el cliente
    # eso se ve como "la app está rota". Para mostrarla, subí a "starter".
    plan: free

    # Render clona el repo y corre estos comandos desde la raíz
    buildCommand: |
      npm install -g pnpm@10
      pnpm install --frozen-lockfile
      pnpm --filter @niagara/db db:generate
      pnpm --filter @niagara/api build
    startCommand: node apps/api/dist/index.js

    # Sincroniza el schema con la DB antes de arrancar. El proyecto usa
    # `prisma db push` (no hay carpeta migrations/).
    #
    # ⚠️  OJO: preDeployCommand SOLO funciona en instancias pagas. Con el plan
    # free Render lo ignora en silencio, la base queda vacía y todas las
    # queries fallan con "table does not exist".
    #
    # Mientras la API esté en free, hay que correr el push a mano después de
    # crear o cambiar la base, usando la External URL:
    #   $env:DATABASE_URL="postgresql://...External URL..."
    #   pnpm --filter @niagara/db exec prisma db push
    #   pnpm --filter @niagara/db db:seed
    #
    # Si más adelante agregás migraciones, cambiá a:
    #   pnpm --filter @niagara/db exec prisma migrate deploy
    preDeployCommand: pnpm --filter @niagara/db exec prisma db push --skip-generate

    # Health check — Render reinicia el servicio si falla
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      # ⚠️  Completar en Render dashboard → Environment:
      - key: DATABASE_URL
        sync: false          # Render te pide el valor manualmente
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false          # ej: https://club-niagara-api.onrender.com
      - key: FRONTEND_URLS
        sync: false          # ej: https://club-niagara.vercel.app (coma-separado)
      # Mercado Pago — opcionales. Sin MP_ACCESS_TOKEN la API arranca igual y
      # solo queda deshabilitado el cobro con terminales Point.
      - key: MP_ACCESS_TOKEN
        sync: false
      # Firma de los webhooks de MP. Sin esto el endpoint acepta notificaciones
      # de cualquier origen: alguien podría marcar cobros como aprobados.
      # Obligatorio antes de cobrar de verdad.
      - key: MP_WEBHOOK_SECRET
        sync: false
